version: 1
rules:
  - id: block-high-and-supplychain
    description: Fail on HIGH/CRITICAL vulnerabilities or supply-chain compromise indicators
    match:
      severities: [HIGH, CRITICAL]
      supply_chain_indicators: [COMPROMISED_RELEASE, MALICIOUS_INSTALL_SCRIPT]
    action: FAIL

  - id: warn-unmaintained
    description: Warn on unmaintained packages but don't fail
    match:
      filter_suites: [ossf-unmaintained]
    action: WARN

  - id: warn-dangerous-workflow
    description: Warn on dangerous workflows but don't fail
    match:
      filter_suites: [ossf-dangerous-workflow]
    action: WARN

  - id: allow-version-drift
    description: Allow version drift without failing
    match:
      filter_suites: [drift]
    action: WARN
