---
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Opcional: agrupa updates menores/patch
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
---
